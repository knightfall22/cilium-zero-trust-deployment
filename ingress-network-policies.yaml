apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-cart-ingress
  namespace: boutique
spec:
  endpointSelector:
    matchLabels:
      app: redis-cart
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cartservice
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: productcatalog-ingress
  namespace: boutique
spec:
  endpointSelector:
    matchLabels:
      app: productcatalogservice
  ingress:
    - fromEndpoints:
      - matchExpressions:
        - key: app
          operator: In
          values: 
            - recommendationservice
            - checkoutservice
            - frontend
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
---
